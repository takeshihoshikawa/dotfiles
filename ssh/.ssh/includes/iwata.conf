# Windows 機（Metashape Pro・128GB）。実行機として Mac から ssh で操作する（2026-10-27 設定）。
# ジョブは ssh から直接起動せず、pine-wilt-shizuoka の run_detached.py（Task Scheduler）で切り離す。
# ssh セッションからは Z: が見えない（ドライブ割り当てはログオンごと）。UNC パスを使う。
Host iwata
    HostName iwata
    User takeshi
    IdentityFile ~/.ssh/id_ed25519_windows
    IdentitiesOnly yes
    ServerAliveInterval 60
    ServerAliveCountMax 3
