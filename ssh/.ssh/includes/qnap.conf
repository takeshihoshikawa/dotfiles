# QNAP への接続先はネットワークに応じて自動選択する。
# 共有 dotfiles なので、LAN内の据置機は LAN 直、LAN外へ持ち出す機は Tailscale 経由。
# SSH は「最初に得た値」が優先されるため、LAN 到達可能なら先に LAN IP を確定させ、
# 駄目なときだけ後段の Tailscale IP へフォールバックする。
# LAN 直を優先する理由: 速い＆QNAPの Tailscale データプレーン障害(2026-07-27)に影響されない。

# LAN内(192.168.70.241:22 が 1 秒以内に開く)なら LAN 直
Match host qnap exec "nc -z -w1 192.168.70.241 22 2>/dev/null"
  HostName 192.168.70.241

# 上で決まらなければ Tailscale 経由(LAN外用)
Match host qnap
  HostName 100.84.255.78

Host qnap
  User owner
  IdentityFile ~/.ssh/id_ed25519_qnap
