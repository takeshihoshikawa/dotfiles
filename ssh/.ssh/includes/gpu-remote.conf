# gpu 計算機（Ubuntu・実行専用）。個体名は robusta（RTX 2080 Ti）と arabica（2台目）。
# gpu-remote は「実行機」という役割名で、既定では robusta の別名。
# robusta の HostName は、実機を hostnamectl / tailscale set --hostname で robusta に改名するまで
# 旧名 my-ubuntu のままにしておく。改名したらこの1行を robusta に直す（bootstrap/README.md）。
Host robusta gpu-remote
    HostName my-ubuntu
    User takeshi
    ServerAliveInterval 60
    ServerAliveCountMax 3
    ForwardAgent yes

# arabica は新機のセットアップ後に有効になる（それまで接続はできない）。
Host arabica
    HostName arabica
    User takeshi
    ServerAliveInterval 60
    ServerAliveCountMax 3
    ForwardAgent yes
