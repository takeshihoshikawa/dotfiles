# gpu 計算機（Ubuntu・実行専用）。個体名は robusta（RTX 2080 Ti）と arabica（2台目）。
# gpu-remote は「実行機」という役割名で、既定では robusta の別名。
# 2026-10-22 に実機を robusta に改名した（旧 Tailscale 名は my-ubuntu。手順は bootstrap/README.md）。
Host robusta gpu-remote
    HostName robusta
    User takeshi
    ServerAliveInterval 60
    ServerAliveCountMax 3
    ForwardAgent yes

# arabica は新機のセットアップ後に有効になる（それまで接続はできない）。
Host arabica
    HostName arabica
    User takeshi
    ServerAliveInterval 60
    ServerAliveCountMax 3
    ForwardAgent yes
